# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Encourages Gradle to use the JDK from this checkout for the build. See the `./gradlew` script
org.gradle.java.installations.fromEnv=AOSP_JDK21

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xms4092m -Xmx24g

# Enable the Gradle Build Cache
org.gradle.caching=true

# Enable Gradle Configuration Cache
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Allow multiple r8 tasks to run in parallel
android.r8.maxWorkers=2

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# Don't generate the build config java file.
android.defaults.buildfeatures.buildconfig=false
composeCompilerVersion=1.5.7
# TODO: b/360397034 - Remove when all projects are migrated to transitive R classes.
android.nonTransitiveRClass=false
# TODO: b/360399067 - Remove when all projects are migrated to final R classes.
android.nonFinalResIds=false
aaosApps.buildCfg.currentSdk=36
aaosApps.buildCfg.buildToolsVersion=36.0.0
aaosApps.buildCfg.defaultJdkToolchain=17
aaosApps.buildCfg.ndkVersion=27.0.12077973
aaosApps.buildCfg.cmakeVersion=3.22.1

# To prevent Jetifier issues with SDV Gateway related jars.
android.jetifier.ignorelist=libsdvgatewayclient-java.jar
